# Driver drowsiness detection - default configuration.
# Generated by scripts/export_config.py from src/drowsiness/config/settings.py.
# These are literature-informed STARTING POINTS, not tuned values.
# Tune on the development split, confirm on validation, never on test.

camera:
  # No usable frame for this long -> CAMERA_UNAVAILABLE. Long enough to ride out a dropped frame or
  # a USB hiccup.
  timeout_s: 2.0
  # Whole-frame mean grey level below which the lens is treated as covered/black.
  dark_frame_mean: 12.0
  # Whole-frame grey std below which the image carries no information (lens covered, uniform glare).
  flat_frame_std: 4.0
  # Identical consecutive frames before the feed is considered frozen (~1.5 s at 30 FPS).
  frozen_frame_count: 45

quality:
  # Inter-ocular distance / image width. Below this the face is too small for reliable eye geometry.
  min_face_width_ratio: 0.06
  # Mean grey level of the face region; darker is unreliable.
  min_face_brightness: 35.0
  # Mean grey level of the face region; brighter is washed out.
  max_face_brightness: 235.0
  # Variance of the Laplacian over the face region. Below this the face is motion-blurred.
  min_sharpness: 8.0
  # EAR is a 2D ratio; beyond this head yaw the eye contour is foreshortened and EAR no longer
  # measures openness.
  max_yaw_for_eyes_deg: 35.0
  # Beyond this pitch (relative to calibrated neutral) the eyelids are viewed too obliquely for EAR
  # to be meaningful.
  max_pitch_for_eyes_deg: 35.0
  # Eye-region brightness / face brightness below this suggests sunglasses or occlusion; eyes are
  # then reported UNOBSERVABLE instead of CLOSED.
  eye_region_dark_ratio: 0.45
  # |EAR_left - EAR_right| above this (with a frontal head) suggests one eye is occluded or mis-
  # tracked; confidence is reduced.
  max_eye_asymmetry: 0.12

calibration:
  # Seconds of good-quality frames used to learn this driver's open-eye EAR and neutral head pose.
  duration_s: 20.0
  # Minimum good frames before a baseline is accepted.
  min_samples: 150
  # Open-eye baseline = this percentile of EAR during calibration. A high percentile ignores blinks
  # and is robust if the driver is already slightly tired.
  ear_percentile: 85.0
  # Population-typical open-eye EAR used before calibration completes.
  default_open_ear: 0.28
  # Lower clamp on the learned baseline (guards against calibrating on a tired driver).
  min_open_ear: 0.18
  # Upper clamp on the learned baseline.
  max_open_ear: 0.42

eyes:
  # Eye CLOSED when EAR < baseline * closed_ratio. With a typical 0.30 baseline this is ~0.20, the
  # commonly used absolute EAR threshold.
  closed_ratio: 0.65
  # Eye returns to OPEN only when EAR > baseline * reopen_ratio. The gap to closed_ratio is per-
  # frame hysteresis that stops chatter around the threshold.
  reopen_ratio: 0.75
  # MediaPipe eyeBlink blendshape score treated as 'closed'. Used as an independent second opinion:
  # agreement raises confidence, disagreement lowers it.
  blendshape_closed: 0.55
  # Closures shorter than this are tracker noise, not blinks (real blinks last >= ~75 ms) and are
  # discarded.
  min_blink_s: 0.05
  # Typical spontaneous blinks last ~0.1-0.4 s. Closures up to this length are normal blinks.
  normal_blink_max_s: 0.4
  # Closures at least this long count as slow blinks (an early drowsiness sign).
  slow_blink_s: 0.5
  # Closures at least this long count as prolonged eye closures.
  long_closure_s: 1.0
  # A closure survives an unobservable gap up to this long; a longer gap ends the episode as
  # 'interrupted' rather than guessing it continued.
  unobserved_gap_tolerance_s: 0.3

blink:
  # Rolling window for blink rate, slow-blink counts and PERCLOS.
  window_s: 60.0
  # PERCLOS is only trusted when eyes were observable for at least this fraction of the window.
  perclos_min_coverage: 0.6
  # Resting blink rate is roughly 10-20/min; sustained rates above this are flagged.
  excessive_rate_per_min: 30.0

mouth:
  # Inner-lip MAR above this = wide mouth opening. Speech rarely exceeds ~0.4.
  yawn_mar: 0.5
  # jawOpen blendshape score that independently indicates a wide opening.
  yawn_blendshape: 0.6
  # A wide opening must last this long to be a yawn. Talking and laughing produce short openings;
  # yawns typically last several seconds.
  min_yawn_s: 2.0
  # Openings separated by less than this are merged into one episode.
  merge_gap_s: 0.4
  # Rolling window for yawn frequency (5 minutes).
  window_s: 300.0

head:
  # Pitch (relative to calibrated neutral, positive = chin down) beyond which the head is 'down'.
  down_pitch_deg: 20.0
  # Head must stay down this long before it counts as sustained head-down.
  down_min_s: 2.0
  # A nod is a pitch drop of at least this many degrees...
  nod_drop_deg: 12.0
  # ...occurring within this time. Deliberate glances at the dashboard are usually slower and
  # shallower.
  nod_max_fall_s: 0.7
  # Pitch must return within this many degrees of neutral before another nod can be counted.
  nod_reset_deg: 6.0
  # Yaw beyond this = looking away (mirror check, passenger). Reported as distraction context, never
  # as drowsiness evidence.
  away_yaw_deg: 40.0
  # Rolling window for nod counts.
  window_s: 60.0
  # If the face disappears within this many seconds of a nod/head-drop/eye closure, the loss is
  # treated as possible slumping, not a neutral sensor gap.
  impaired_lookback_s: 3.0

observation:
  # Face missing for less than this: hold the last state with decaying confidence (detector
  # flicker). Longer: UNKNOWN.
  face_loss_grace_s: 1.0
  # Confidence lost per second while holding state through a face dropout.
  confidence_decay_per_s: 0.5

risk:
  # Current continuous eye closure. 2 s with eyes shut at 70 mph is ~60 m driven blind; 3 s is
  # treated as a probable microsleep.
  ongoing_closure_s: [1.0, 2.0, 3.0]
  # Fraction of observed time eyes were closed in the window. ~0.15 is a commonly cited onset of
  # drowsiness in the PERCLOS literature.
  perclos: [0.15, 0.25, 0.4]
  # Number of closures >= long_closure_s in the blink window.
  long_closures: [2, 3, 1.0e9]
  # Number of slow blinks in the blink window (capped at severity 1).
  slow_blinks: [4, 1.0e9, 1.0e9]
  # Nods in the head window. One nod alone is ignored: a single quick glance down looks the same.
  nods: [2, 3, 1.0e9]
  # Sustained head-down time *while eyes are not confirmed open*. Head down with eyes open is a
  # dashboard glance (distraction), not drowsiness.
  head_down_s: [2.0, 4.0, 1.0e9]
  # Yawns in the yawn window. Yawning alone never exceeds severity 1.
  yawns: [2, 1.0e9, 1.0e9]
  # Blinks per minute. Excess blinking alone never exceeds severity 1.
  blink_rate: [30.0, 1.0e9, 1.0e9]
  # Eye closure of at least this long *combined with* the head down/dropping is CRITICAL.
  critical_combo_closure_s: 2.0
  # Three independent signal categories (eyes, head, mouth/blink) all at severity >= 1 also make
  # HIGH risk.
  min_categories_for_high: 3

state_machine:
  # Target level must persist this long before escalating. Critical is immediate because its rule
  # already contains a multi-second duration.
  escalate_confirm_s:
    DROWSINESS_WARNING: 0.5
    HIGH_DROWSINESS_RISK: 0.3
    CRITICAL_SLEEP_RISK: 0.0
  # Lower risk must persist this long before stepping down ONE level from the given state. Fast to
  # escalate, slow to recover.
  deescalate_hold_s:
    CRITICAL_SLEEP_RISK: 5.0
    HIGH_DROWSINESS_RISK: 8.0
    DROWSINESS_WARNING: 10.0
  # After UNKNOWN / CAMERA_UNAVAILABLE / MONITORING, low risk must be observed this long before
  # reporting ALERT.
  recovery_confirm_s: 2.0

alerts:
  # Minimum seconds between repeat alerts of the same type. An escalation to a more severe type
  # always fires immediately.
  cooldown_s:
    DROWSINESS_WARNING: 30.0
    HIGH_DROWSINESS_RISK: 15.0
    CRITICAL_SLEEP_RISK: 5.0
    UNKNOWN: 60.0
    CAMERA_UNAVAILABLE: 60.0

privacy:
  # Save a downscaled JPEG when a HIGH/CRITICAL alert fires. Off by default.
  save_snapshots: false
  # Snapshots are downscaled to at most this width.
  snapshot_max_width: 320
  # Record raw video. Off by default; the system never needs it.
  record_video: false
  # Record the per-frame numeric feature stream (no pixels) for replay and evaluation.
  record_features: false

logging:
  # Where event and decision logs are written.
  directory: "logs"
  console_level: "INFO"
